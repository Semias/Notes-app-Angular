version: "2"
sql:
  - engine: "postgresql"
    queries: "sql/queries.sql"
    schema: "sql/migrations/"
    gen:
      go:
        package: "database"
        out: "internal/database"
        # Generate code compatible with pgx/v5
        sql_package: "pgx/v5"

        # Without these two, sqlc emits structs with no JSON tags at all, so the
        # API would serialize PascalCase keys - {"ID":1,"Title":"..."} - and every
        # field would read as undefined in the Angular client.
        emit_json_tags: true
        json_tags_case_style: "camel"

        # :many queries return an empty slice rather than nil, so an empty table
        # encodes as [] instead of null.
        emit_empty_slices: true

        overrides:
          # By default timestamptz maps to pgtype.Timestamptz, which serializes as
          # {"Time":"...","Valid":true} rather than a plain ISO-8601 string.
          - db_type: "timestamptz"
            go_type: "time.Time"
